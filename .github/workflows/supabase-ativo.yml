# Mantém o projeto Supabase ativo: o plano gratuito pausa após ~7 dias sem uso.
# Em 11/2026 o projeto pausou mesmo com um ping 2x/semana que só lia a hora.
# Agora: TODO DIA, uma escrita real no banco (função public.manter_ativo()).
# A chave usada é a pública (a mesma que já está no editor).
name: Mantém o Supabase ativo
on:
  schedule:
    - cron: "17 13 * * *"   # todo dia, 10h17 em Brasília
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sinal de vida no Supabase
        env:
          URL: https://osqibajvwoxzdugdwygn.supabase.co
          KEY: sb_publishable_5UtARpzra6IMw6AwGPmL3A_zhqN6FzY
        run: |
          set -u
          H=(-H "apikey: $KEY" -H "Content-Type: application/json")
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/manter_ativo" "${H[@]}" -d '{}' || echo 000)
          echo "manter_ativo → HTTP $code: $(cat resp.txt 2>/dev/null)"
          if [ "$code" = "200" ]; then exit 0; fi
          if [ "$code" = "404" ]; then
            # banco ainda sem a função nova (script não rodado): usa o ping antigo
            echo "::warning::Função manter_ativo não encontrada — rode o supabase/schema.sql atualizado. Usando o ping antigo."
            curl -fsS -X POST "$URL/rest/v1/rpc/ping" "${H[@]}" -d '{}'; echo
            exit 0
          fi
          echo "::error::Supabase não respondeu como esperado (HTTP $code). O projeto pode estar pausado."
          exit 1
